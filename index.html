<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Camera Access</title>
  </head>

  <body>
    <label for="selfie">Take a Selfie:</label>
    <input type="file" id="selfie" accept="image/*" capture="user" />
  </body>   
</html>

<!-- camera access code is correct. It allows users to take a selfie using their device's camera. The input element with type "file" and the "capture" attribute set to "user" enables this functionality. When the user clicks on the input, it will prompt them to take a photo using their device's camera. -->
